name: Self Test (Auggie Reusable)

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without committing/pushing or opening PR; upload artifacts only'
        required: false
        default: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Echo context
        run: |
          echo "Event: ${{ github.event_name }} | Repo: ${{ github.repository }} | Ref: ${{ github.ref }}"
  test:
    needs: preflight
    uses: rishitank/auggie-dependabot/.github/workflows/auggie.yml@1b5e987fb5d0c5bc0980c0c014bc9a44c57f711b # main
    with:
      pr-labels: 'dependencies,auggie,self-test'
      pr-reviewers: ''
      auggie-config-path: '.auggie.yml'
      auggie-run-args: '--compact'
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

